<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeiDireta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f2ea; --ink:#1c2632; --soft:#5f6772; --rule:#d8d0bf; --rule2:#e7e1d4;
  --navy:#1f3a5a; --cobre:#9c5a2a; --hl:#efe6d3; --card:#fffdf8; --focus:rgba(156,90,42,.16);
  --serif:"Newsreader",Georgia,serif; --sans:"Libre Franklin",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
:root[data-theme=dark]{--paper:#15191e; --ink:#e7e2d7; --soft:#9aa0a8; --rule:#343a42; --rule2:#252a31; --navy:#9dbbe0; --cobre:#d99862; --hl:#22282f; --card:#1c2128; --focus:rgba(217,152,98,.2);}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--paper:#15191e; --ink:#e7e2d7; --soft:#9aa0a8; --rule:#343a42; --rule2:#252a31; --navy:#9dbbe0; --cobre:#d99862; --hl:#22282f; --card:#1c2128; --focus:rgba(217,152,98,.2);}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.page{max-width:1040px;margin:0 auto;padding:40px 28px 80px}

.mast{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
.logo{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:-.6px;line-height:1}
.logo i{font-style:italic;font-weight:500;color:var(--cobre)}
.tag{font-size:12.5px;color:var(--soft);letter-spacing:.2px}
.tag b{font-weight:600;color:var(--ink)}

.mast-r{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.tema{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px 5px 9px;font:500 12.5px var(--sans);cursor:pointer}
.tema:hover{border-color:var(--cobre);color:var(--cobre)}
.tema svg{width:16px;height:16px}
.find{position:sticky;top:0;z-index:4;background:var(--paper);padding:20px 0 10px}
.find label{display:block;font-size:11.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--navy);margin-bottom:8px}
.field{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--rule);border-radius:10px;padding:5px 5px 5px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:text;transition:border-color .15s,box-shadow .15s}
.field:hover{border-color:var(--soft)}
.field:focus-within{border-color:var(--cobre);box-shadow:0 0 0 4px var(--focus)}
.field .lupa{flex:none;width:22px;height:22px;color:var(--soft)}
.field:focus-within .lupa{color:var(--cobre)}
#q{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-family:var(--sans);font-size:18px;padding:12px 0}
#q::placeholder{color:var(--soft);opacity:.85}
.btn-buscar{flex:none;display:flex;align-items:center;gap:8px;border:0;border-radius:7px;background:var(--ink);color:var(--paper);font:600 14px var(--sans);padding:12px 20px;cursor:pointer}
.btn-buscar svg{width:17px;height:17px}
.btn-buscar:hover{background:var(--cobre)}
@media (max-width:560px){.btn-buscar span{display:none}.btn-buscar{padding:12px 13px}#q{font-size:16px}}
.how{font-family:var(--mono);font-size:11.5px;color:var(--soft);margin-top:8px;display:flex;gap:18px;flex-wrap:wrap}
.how em{font-style:normal;color:var(--ink)}

h2{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--navy);margin:38px 0 0;padding-bottom:7px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none;color:var(--soft);font-weight:400}
h2 button{border:0;background:none;font:inherit;color:var(--soft);cursor:pointer;letter-spacing:0;text-transform:none;font-family:var(--mono);font-size:11px}

/* principais: grade de "lombadas" */
.main{display:grid;grid-template-columns:repeat(4,1fr);border-left:1px solid var(--rule2)}
@media (max-width:820px){.main{grid-template-columns:repeat(2,1fr)}}
.main a{position:relative;display:block;padding:14px 16px 13px;border-right:1px solid var(--rule2);border-bottom:1px solid var(--rule2)}
.main a:hover,.main a.sel{background:var(--hl)}
.main .sg{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:-.3px;line-height:1.1}
.main .nm{font-size:12.5px;margin-top:3px;color:var(--ink)}
.main .nr{font-family:var(--mono);font-size:11px;color:var(--soft);margin-top:2px}

/* sumário com pontilhado */
.toc{columns:2;column-gap:44px;margin-top:6px}
@media (max-width:820px){.toc{columns:1}}
.toc a,.res a.row{position:relative;display:flex;align-items:baseline;gap:6px;padding:6px 4px;break-inside:avoid;border-radius:2px}
.toc a:hover,.res a.row:hover,.res a.sel{background:var(--hl)}
.toc .nm,.res .nm{flex:0 1 auto}
.toc .dots,.res .dots{flex:1 1 20px;border-bottom:1px dotted var(--rule);transform:translateY(-4px);min-width:16px}
.toc .nr,.res .nr{font-family:var(--mono);font-size:12px;color:var(--soft);white-space:nowrap}
.pin{position:absolute;top:50%;right:-2px;transform:translateY(-50%);opacity:0;border:0;background:var(--paper);color:var(--soft);font-family:var(--mono);font-size:10.5px;padding:2px 6px;cursor:pointer;border:1px solid var(--rule);border-radius:2px}
.main .pin{top:10px;right:10px;transform:none}
a:hover .pin,.pin.on{opacity:1}
@media (hover:none){.pin{display:none}}
.pin.on{color:var(--cobre);border-color:var(--cobre)}

.recent{font-family:var(--mono);font-size:12.5px;margin-top:10px;line-height:2}
.recent a{border-bottom:1px solid var(--rule);margin-right:14px}
.recent a:hover{border-color:var(--cobre);color:var(--cobre)}

/* resultados */
.res{margin-top:6px}
.res .lab{font-family:var(--mono);font-size:11px;color:var(--soft);margin:18px 0 4px}
.go{display:flex;justify-content:space-between;align-items:center;gap:18px;border:1px solid var(--ink);padding:14px 18px;margin-top:12px}
.res a.go:hover,.res a.go.sel{background:var(--ink);color:var(--paper)}
#q::-webkit-search-cancel-button{-webkit-appearance:none}
.go .t{font-family:var(--serif);font-size:21px;font-weight:600}
.go .d{font-size:12.5px;opacity:.75;margin-top:2px}
.go .ar{font-family:var(--mono);font-size:13px;white-space:nowrap}
.alt{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--navy);border-bottom:1px solid var(--rule)}
.alt:hover{border-color:var(--navy)}
.none{margin-top:16px;color:var(--soft);font-size:14px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);font-size:13px;padding:10px 16px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}

.cnt{position:absolute;bottom:12px;right:14px;font-family:var(--mono);font-size:10.5px;color:var(--cobre)}
.nov-bar{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;margin-top:10px;font-size:13px}
.nov-bar button{border:0;background:none;padding:2px 0;font:inherit;color:var(--soft);cursor:pointer;border-bottom:2px solid transparent}
.nov-bar button.on{color:var(--ink);border-bottom-color:var(--cobre);font-weight:600}
.nov-bar label{margin-left:auto;font-size:12px;color:var(--soft);display:flex;gap:6px;align-items:center;cursor:pointer}
.nov{margin-top:8px}
.nov a{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:9px 4px;border-bottom:1px solid var(--rule2)}
.nov a:hover{background:var(--hl)}
.nov .id{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.nov .id small{display:block;color:var(--soft);font-size:11px}
.nov .em{font-size:13.5px;line-height:1.4}
.nov .new{font-family:var(--mono);font-size:10px;color:var(--paper);background:var(--cobre);padding:1px 5px;margin-left:6px;vertical-align:1px}
.nov-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--soft)}
.nov-foot a,.nov-foot button{color:var(--navy);border:0;background:none;font:inherit;cursor:pointer;padding:0;border-bottom:1px solid var(--rule)}
@media (max-width:640px){.nov a{grid-template-columns:1fr;gap:2px}}
footer{margin-top:56px;padding-top:12px;border-top:1px solid var(--rule);font-size:12px;color:var(--soft);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
</style>
<script>try{var t=JSON.parse(localStorage.getItem("ld_tema"));if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>

</div>

/* resolve qualquer norma: devolve {title, path, exact, quadro, year} */
function resolve(type, n, y){
  const TN = {L:"Lei",LC:"Lei Complementar",DL:"Decreto-Lei",D:"Decreto"}[type];
  const cur = C.find(c=>c[2]===type && +c[3]===n && (!y || +c[4]===y));
  if(cur) return {title:`${TN} nº ${dotted(n)}/${cur[4]}`, sub:cur[1], path:cur[5], exact:true, year:+cur[4]};
  if(type==="LC"){
    return {title:`Lei Complementar nº ${n}`, path:"leis/lcp/lcp"+(n<10?String(n).padStart(2,"0"):n)+".htm", exact:true, quadro:"leis/lcp/quadro_lcp.htm"};
  }
  if(type==="DL"){
    const old = (y && y<1950) || n>2481;
    const q = old ? "Decreto-Lei/1937-1946/_quadro.htm" : "Decreto-Lei/1965-1988/_quadro.htm";
    return {title:`Decreto-Lei nº ${dotted(n)}${y?"/"+y:""}`, path:q, exact:false, quadro:q,
      note: old? "Quadro oficial dos decretos-leis de 1937 a 1946" : "Quadro oficial dos decretos-leis de 1965 a 1988",
      other: (!y && n<=2481) ? {label:"Ver também o quadro de 1937 a 1946", path:"Decreto-Lei/1937-1946/_quadro.htm"} : null};
  }
  if(type==="D"){
    const modern = (!y || y>=1991) && n<20000;
    const yr = y || (modern ? yearOf(DY,n) : null);
    if(modern){
      const r = RUNS.D.find(r=>n>=r[0]&&n<=r[1]);
      if(r) return {title:`Decreto nº ${dotted(n)}/${yr}`, path:fill(r[2],n), exact:true, quadro:quadroDec(yr), year:yr};
      if(yr>=2004) return {title:`Decreto nº ${dotted(n)}/${yr}`, path:`_Ato${blk(yr)}/${yr}/Decreto/d${n}.htm`, exact:true, quadro:quadroDec(yr), year:yr};
    }
    return {title:`Decreto nº ${dotted(n)}${yr?"/"+yr:""}`, path:quadroDec(yr), exact:false, quadro:quadroDec(yr),
      note: yr ? `Quadro oficial dos decretos de ${yr}` : "Decretos anteriores a 1991: informe o ano (ex.: decreto 20.910/1932)"};
  }
  // Lei ordinária
  const yr = y || yearOf(LY,n);
  if((!y || y>=1988) && n>=7647){
    const r = RUNS.L.find(r=>n>=r[0]&&n<=r[1]);
    if(r) return {title:`Lei nº ${dotted(n)}/${yr}`, path:fill(r[2],n), exact:true, quadro:quadroLei(yr), year:yr};
    if(yr>=2005) return {title:`Lei nº ${dotted(n)}/${yr}`, path:`_Ato${blk(yr)}/${yr}/Lei/l${n}.htm`, exact:true, quadro:quadroLei(yr), year:yr};
  }
  return {title:`Lei nº ${dotted(n)}${yr?"/"+yr:""}`, path:quadroLei(yr), exact:false, quadro:quadroLei(yr), note:`Quadro oficial das leis de ${yr||"todos os anos"}`, year:yr};
}

function parse(raw){
  let s = norm(raw).trim().replace(/\s+/g," ");
  let art = null;
  const ma = s.match(/(?:^|\s)art(?:igo|s)?\.?\s*(\d[\d.]*)\s*(?:-?\s*([a-z]))?(?=\s|$)/);
  if(ma){ art = ma[1].replace(/\./g,"") + (ma[2]?"-"+ma[2].toUpperCase():""); s = (s.slice(0,ma.index)+" "+s.slice(ma.index+ma[0].length)).trim(); }
  // tipo + número (+ ano)
  const mt = s.match(/^(lei complementar|lcp|lc|decreto[- ]?lei|dl|del|decreto|dec|lei|l|d)\s*(?:n[oº°.]*\s*)?(\d[\d.]*)\s*(?:[\/ ,-]\s*(?:de\s*)?(\d{2,4}))?\s*(\d[\d.]*)?$/);
  if(mt){
    const t = /^(lei complementar|lcp|lc)$/.test(mt[1])?"LC":/^(decreto[- ]?lei|dl|del)$/.test(mt[1])?"DL":/^(decreto|dec|d)$/.test(mt[1])?"D":"L";
    let y = mt[3]?+mt[3]:null; if(y && y<100) y += y>30?1900:2000;
    if(!art && mt[4]) art = mt[4].replace(/\./g,"");
    return {kind:"norma", type:t, n:+mt[2].replace(/\./g,""), y, art};
  }
  // sigla + artigo  (cc 421 · cpc 1.015 · 421 cc)
  let m = s.match(/^([a-z][a-z0-9 .]*?)\s+(\d[\d.]*)\s*(?:-?\s*([a-z]))?$/) ;
  let key, num, suf;
  if(m){ key=m[1]; num=m[2]; suf=m[3]; }
  else { m = s.match(/^(\d[\d.]*)\s+([a-z][a-z0-9 .]*)$/); if(m){ key=m[2]; num=m[1]; } }
  if(key){
    const k = key.replace(/[^a-z0-9]/g,"");
    const law = SIG[k];
    if(law) return {kind:"artigo", law, art: num.replace(/\./g,"")+(suf?"-"+suf.toUpperCase():"")};
  }
  if(art && SIG[s.replace(/[^a-z0-9]/g,"")]) return {kind:"artigo", law:SIG[s.replace(/[^a-z0-9]/g,"")], art};
  // só número: lei ordinária
  const mn = s.match(/^(\d[\d.]{2,})(?:\s*[\/ ]\s*(\d{2,4}))?$/);
  if(mn){ let y=mn[2]?+mn[2]:null; if(y && y<100) y += y>30?1900:2000; return {kind:"norma", type:"L", n:+mn[1].replace(/\./g,""), y, art}; }
  return {kind:"texto", art};
}

/* ---------- renderização ---------- */
const artLabel = a => { const [n,s]=a.split("-"); return (n.length>3?dotted(n):n)+(s?"-"+s:""); };
const $res = document.getElementById("res"), $home = document.getElementById("home"), $q = document.getElementById("q");

function tocRow(l){
  return `<a href="${href(l.path)}" target="_blank" rel="noopener" data-id="${esc(l.id)}">
    <span class="nm">${esc(l.nome)}</span><span class="dots"></span><span class="nr">${esc(l.ref)}</span>
    <button class="pin ${pins.has(l.id)?"on":""}" data-pin="${esc(l.id)}">${pins.has(l.id)?"fixada":"fixar"}</button></a>`;
}
function mainCell(l){
  return `<a href="${href(l.path)}" target="_blank" rel="noopener" data-id="${esc(l.id)}">
    <div class="sg">${esc(l.sg)}</div><div class="nm">${esc(l.nome)}</div><div class="nr">${esc(l.ref)}</div>
    <button class="pin ${pins.has(l.id)?"on":""}" data-pin="${esc(l.id)}">${pins.has(l.id)?"fixada":"fixar"}</button></a>`;
}

function renderHome(){
  const h=[];
  const pv = LAWS.filter(l=>pins.has(l.id));
  if(pv.length) h.push(`<h2>Fixadas <small>${pv.length}</small></h2><div class="main">${pv.map(mainCell).join("")}</div>`);
  const meu = Object.values(uso).sort((a,b)=>b.c-a.c||b.l-a.l).slice(0,8);
  if(meu.length) h.push(`<h2>Suas mais consultadas <small>neste navegador</small></h2><div class="main">${meu.map(e=>{
      const l = e.id && byId[e.id];
      return `<a href="${esc(e.u)}" target="_blank" rel="noopener" ${l?`data-id="${esc(l.id)}"`:`data-title="${esc(e.t)}"`}>
        <div class="sg">${esc(l?l.sg:e.t)}</div><div class="nm">${esc(l?l.nome:"Planalto")}</div><div class="nr">${esc(l?l.ref:"")}</div>
        <span class="cnt">${e.c} ${e.c>1?"consultas":"consulta"}</span></a>`;}).join("")}</div>`);
  if(recent.length) h.push(`<h2>Consultadas por último <button id="clr">limpar</button></h2><div class="recent">${
    recent.map(r=>`<a href="${esc(r.u)}" target="_blank" rel="noopener" data-rec="1" data-art="${esc(r.a||"")}">${esc(r.t)}</a>`).join("")}</div>`);
  h.push(`<h2>Mais consultadas</h2><div class="main">${LAWS.filter(l=>l.top).map(mainCell).join("")}</div>`);
  h.push(`<h2>Publicadas recentemente <small>atualizado em ${esc(fmtData(NOVAS.atualizado))}</small></h2><div id="novas"></div>`);
  const order = ["Processo civil","Civil","Imobiliário e registral","Família e sucessões","Empresarial","Administrativo","Tributário","Penal","Trabalho e previdência","Constitucional","Ambiental","Digital e dados","Eleitoral"];
  for(const a of order){
    const it = LAWS.filter(l=>!l.top && l.area===a);
    if(it.length) h.push(`<h2>${esc(a)} <small>${it.length}</small></h2><div class="toc">${it.map(tocRow).join("")}</div>`);
  }
  $home.innerHTML = h.join("");
  renderNovas();
  const c = document.getElementById("clr");
  if(c) c.onclick = ()=>{ recent=[]; store.set("recent",recent); renderHome(); };
}

/* ---------- publicadas recentemente ---------- */
const ORC = /^Abre (ao|aos) Or|cr[ée]dito (suplementar|especial|extraordin)|estima a receita e fixa a despesa|Lei Or[çc]ament[áa]ria de|Anexo V à Lei/i;
let novTipo = "L", novTudo = false, novOrc = store.get("orc", false);
const fmtData = iso => { try{ const d=new Date(iso); return d.toLocaleDateString("pt-BR")+" às "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }catch(e){ return iso; } };
function renderNovas(){
  const box = document.getElementById("novas"); if(!box) return;
  const TN = {L:"Lei",LC:"LC",D:"Decreto"};
  let list = (NOVAS[novTipo]||[]);
  const ocultas = novOrc ? 0 : list.filter(x=>ORC.test(x[3])).length;
  if(!novOrc) list = list.filter(x=>!ORC.test(x[3]));
  const total = list.length;
  if(!novTudo) list = list.slice(0,8);
  const ano = new Date().getFullYear();
  const quadro = novTipo==="L" ? quadroLei(ano) : novTipo==="D" ? quadroDec(ano) : "leis/lcp/quadro_lcp.htm";
  box.innerHTML = `
    <div class="nov-bar">
      ${["L","LC","D"].map(t=>`<button data-nt="${t}" class="${t===novTipo?"on":""}">${{L:"Leis",LC:"Leis complementares",D:"Decretos"}[t]}</button>`).join("")}
      ${novTipo!=="LC"?`<label><input type="checkbox" id="orc" ${novOrc?"checked":""}> mostrar créditos orçamentários${ocultas?` (${ocultas} ocultos)`:""}</label>`:""}
    </div>
    <div class="nov">${list.map(x=>`<a href="${BASE+x[2]}" target="_blank" rel="noopener" data-title="${TN[novTipo]} ${dotted(x[0])}">
      <div class="id">${TN[novTipo]} ${dotted(x[0])}${x[0]>(vistosAntes[novTipo]||0)&&vistosAntes[novTipo]?'<span class="new">nova</span>':""}<small>${esc(x[1])}</small></div>
      <div class="em">${esc(x[3])}${x[3].length>=135?"…":""}</div></a>`).join("") || '<div class="none">Nada nesta lista.</div>'}</div>
    <div class="nov-foot">
      <span>${total>8?`<button id="novmais">${novTudo?"mostrar menos":"mostrar todas ("+total+")"}</button>`:""}</span>
      <a href="${BASE+quadro}" target="_blank" rel="noopener">Lista oficial completa no Planalto ↗</a>
    </div>`;
}
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-nt]"); if(b){ novTipo=b.dataset.nt; novTudo=false; renderNovas(); return; }
  if(e.target.id==="novmais"){ novTudo=!novTudo; renderNovas(); }
});
document.addEventListener("change", e=>{ if(e.target.id==="orc"){ novOrc=e.target.checked; store.set("orc",novOrc); renderNovas(); } });
// marca o que já foi visto nesta visita (a etiqueta "nova" aparece só para o que surgiu desde a visita anterior)
store.set("vistos",{L:(NOVAS.L[0]||[0])[0],LC:(NOVAS.LC[0]||[0])[0],D:(NOVAS.D[0]||[0])[0]});

let items=[], sel=0;
function goBlock(title, sub, url, art, extra){
  return `<a class="go" href="${esc(url)}" target="_blank" rel="noopener" data-title="${esc(title)}" data-art="${esc(art||"")}">
    <div><div class="t">${esc(title)}</div>${sub?`<div class="d">${esc(sub)}</div>`:""}</div>
    <div class="ar">abrir ↗</div></a>${extra||""}`;
}

function search(){
  const raw = $q.value.trim();
  if(!raw){ $res.innerHTML=""; $home.style.display=""; items=[]; return; }
  $home.style.display="none";
  const p = parse(raw), h=[];

  if(p.kind==="artigo"){
    const l = p.law, a = p.art;
    h.push(goBlock(`${l.sg}, art. ${artLabel(a)}`, `${l.nome} · ${l.ref}`, href(l.path,a), a).replace('<a class="go"', `<a class="go" data-id="${esc(l.id)}"`));
  }
  if(p.kind==="norma" && p.n){
    const r = resolve(p.type, p.n, p.y);
    if(r.exact){
      const t = r.title + (p.art?`, art. ${artLabel(p.art)}`:"");
      const extra = r.quadro ? `<a class="alt" href="${BASE+r.quadro}" target="_blank" rel="noopener">Conferir no quadro oficial${r.year?" de "+r.year:""}</a>` : "";
      h.push(goBlock(t, r.sub || "Texto oficial no Planalto", href(r.path,p.art), p.art, extra));
    } else {
      const extra = r.other ? `<a class="alt" href="${BASE+r.other.path}" target="_blank" rel="noopener">${esc(r.other.label)}</a>` : "";
      h.push(goBlock(r.title, (r.note||"Quadro oficial")+" · a norma está na lista, em ordem de número", BASE+r.path, "", extra));
    }
  }
  // nomes do índice
  const nq = norm(raw), words = nq.split(/\s+/).filter(w=>w.length>1 || /\d/.test(w));
  if(p.kind==="texto" || p.kind==="norma"){
    const hits = LAWS.map(l=>{
      let s=0;
      if(norm(l.sg)===nq) s+=100;
      if(words.length && words.every(w=>l.hay.includes(w))) s+=40+(norm(l.nome).startsWith(nq)?20:0)+(l.top?5:0);
      return {l,s};
    }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.l)
      .filter(l=>!(p.kind==="norma" && +l.num===p.n && l.type===p.type));
    if(hits.length){
      if(h.length) h.push(`<div class="lab">No índice</div>`);
      h.push(hits.map(l=>`<a class="row" href="${href(l.path,p.art)}" target="_blank" rel="noopener" data-id="${esc(l.id)}" data-art="${esc(p.art||"")}">
        <span class="nm">${esc(l.nome)}</span><span class="dots"></span><span class="nr">${esc(l.ref)}</span></a>`).join(""));
    }
  }
  if(!h.length) h.push(`<div class="none">Digite o número da norma (ex.: <b>lei 10.406</b>, <b>decreto 3.048</b>, <b>lc 123</b>) ou a sigla com o artigo (ex.: <b>cpc 1015</b>).</div>`);
  $res.innerHTML = h.join("");
  items = [...$res.querySelectorAll("a.go, a.row")];
  sel=0; mark();
}
function mark(){ items.forEach((el,i)=>el.classList.toggle("sel",i===sel)); }

/* ---------- eventos ---------- */
let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),4200); }

function logOpen(a){
  const title = a.dataset.title || (a.dataset.id && byId[a.dataset.id] ? byId[a.dataset.id].sg + (a.dataset.art?", art. "+a.dataset.art:"") : a.textContent.trim());
  const u = a.getAttribute("href");
  recent = [{t:title,u,a:a.dataset.art||""}, ...recent.filter(r=>r.u!==u)].slice(0,12);
  store.set("recent",recent);
  const key = a.dataset.id ? "id:"+a.dataset.id : "u:"+u.split("#")[0];
  const base = a.dataset.id && byId[a.dataset.id] ? byId[a.dataset.id].sg : title.replace(/, art\..*$/,"");
  const e = uso[key] || {t:base, u:u.split("#")[0], id:a.dataset.id||"", c:0};
  e.c++; e.l = Date.now(); uso[key] = e;
  store.set("uso",uso);
}

document.addEventListener("click", e=>{
  const pb = e.target.closest("[data-pin]");
  if(pb){ e.preventDefault(); e.stopPropagation(); const id=pb.dataset.pin; pins.has(id)?pins.delete(id):pins.add(id); store.set("pins",[...pins]); renderHome(); if($q.value.trim()) search(); return; }
  const a = e.target.closest("a[href^='http']");
  if(!a) return;
  if(a.closest("#res") || a.closest("#home")){
    logOpen(a);
    const art = a.dataset.art;
    if(art){
      const label = "Art. " + artLabel(art);
      try{ navigator.clipboard.writeText(label).catch(()=>{}); }catch(err){}
      toast(`Abrindo no ${label}. Se a página não rolar até ele, tecle Ctrl+F e Ctrl+V.`);
    }
    if(!$q.value.trim()) setTimeout(renderHome,60);
  }
});
$q.addEventListener("input", search);
$q.addEventListener("keydown", e=>{
  if(e.key==="ArrowDown"&&items.length){ e.preventDefault(); sel=Math.min(sel+1,items.length-1); mark(); items[sel].scrollIntoView({block:"nearest"}); }
  else if(e.key==="ArrowUp"&&items.length){ e.preventDefault(); sel=Math.max(sel-1,0); mark(); items[sel].scrollIntoView({block:"nearest"}); }
  else if(e.key==="Enter"&&items[sel]){ e.preventDefault(); items[sel].click(); }
  else if(e.key==="Escape"){ $q.value=""; search(); }
});
document.addEventListener("keydown", e=>{ if(e.key==="/" && document.activeElement!==$q){ e.preventDefault(); $q.focus(); $q.select(); } });
// campo de busca: clicar em qualquer ponto da caixa foca o texto; o botão Buscar abre o primeiro resultado
document.getElementById("field").addEventListener("click", e=>{ if(!e.target.closest("#buscar")) $q.focus(); });
document.getElementById("buscar").addEventListener("click", ()=>{
  if($q.value.trim() && items[sel]) items[sel].click();
  else { $q.focus(); toast("Digite o nome, o número ou o artigo da lei. Ex.: cpc 1015"); }
});
// tema claro / escuro (segue o sistema até a pessoa escolher)
const SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>';
const LUA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg>';
const temaAtual = () => document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
function pintaTema(){ const escuro = temaAtual()==="dark"; document.getElementById("tema").innerHTML = (escuro?SOL:LUA) + (escuro?"Tema claro":"Tema escuro"); }
document.getElementById("tema").addEventListener("click", ()=>{
  const novo = temaAtual()==="dark" ? "light" : "dark";
  document.documentElement.dataset.theme = novo; store.set("tema", novo); pintaTema();
});
pintaTema();
// celular e tablet: a lei abre na mesma aba (no computador continua abrindo em aba nova)
const TOQUE = matchMedia("(hover: none) and (pointer: coarse)").matches;
document.addEventListener("click", e=>{
  if(!TOQUE || e.defaultPrevented) return;
  const a = e.target.closest("a[href^='http']");
  if(!a) return;
  e.preventDefault();
  location.href = a.href;
});

renderHome();
$q.focus();
// busca a lista mais recente gerada pelo robô diário (novas.json, no próprio site)
fetch("novas.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(d=>{
  if(!d || !d.L || !d.L.length) return;
  NOVAS = d;
  Object.assign(LY, d.inicioAno&&d.inicioAno.L||{}); Object.assign(DY, d.inicioAno&&d.inicioAno.D||{});
  if(!$q.value.trim()) renderHome();
  store.set("vistos",{L:(d.L[0]||[0])[0],LC:(d.LC[0]||[0])[0],D:(d.D[0]||[0])[0]});
}).catch(()=>{});
</script>
</body>
