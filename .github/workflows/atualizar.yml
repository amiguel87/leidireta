name: Atualizar normas recentes

on:
  schedule:
    # 21:17 UTC = 18:17 em Brasília, de segunda a sexta
    - cron: "17 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Ler quadros do Planalto
        run: python scripts/atualizar_novas.py

      - name: Gravar alterações
        run: |
          if git diff --quiet -- novas.json; then
            echo "Nada a gravar."
          else
            git config user.name "robo-leidireta"
            git config user.email "robo-leidireta@users.noreply.github.com"
            git add novas.json
            git commit -m "Atualiza normas recentes"
            git push
          fi
