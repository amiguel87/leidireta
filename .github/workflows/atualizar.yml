name: Atualizar normas recentes

on:
  schedule:
    # 21:17 UTC = 18:17 em Brasília, de segunda a sexta
    - cron: "17 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Diagnóstico do acesso ao Planalto
        run: |
          curl -sS -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" \
            -o /tmp/q.html -w "HTTP %{http_code} | %{size_download} bytes | %{url_effective}\n" \
            "https://www.planalto.gov.br/ccivil_03/_Ato2023-2026/2026/Lei/_leis2026.htm" || true
          head -c 700 /tmp/q.html | iconv -f windows-1252 -t utf-8 || true
          echo

      - name: Ler quadros do Planalto
        run: python scripts/atualizar_novas.py

      - name: Gravar alterações
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Atualiza normas recentes
          file_pattern: novas.json
          
